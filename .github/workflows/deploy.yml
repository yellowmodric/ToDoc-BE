name: CD - Build Docker & Push to ECR

on:
  push:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: repository 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: gradlew 실행 권한
        run: chmod +x ./gradlew

      - name: gradle 빌드
        run: ./gradlew build -x test

      - name: AWS 인증(ECR Push)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: ECR 로그인
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - name: Docker 이미지 빌드
        run: docker build -t todoc-server .

      - name: Docker 이미지 태깅
        run: |
          docker tag todoc-server:latest \
          ${{ steps.login-ecr.outputs.registry }}/todoc-server:latest

      - name: ECR에 이미지 push
        run: |
          docker push \
          ${{ steps.login-ecr.outputs.registry }}/todoc-server:latest

      - name: SSH로 EC2에 접속하기
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script_stop: true
          script: |
            docker stop todoc-server || true
            docker rm todoc-server || true
            docker pull ${{ steps.login-ecr.outputs.registry }}/todoc-server:latest
            docker run -d \
              --name todoc-server \
              -p 8080:8080 \
              --env-file /home/ubuntu/todoc.env \
              ${{ steps.login-ecr.outputs.registry }}/todoc-server:latest

