name: CD - Build Docker & Push to ECR

on:
  push:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 레포지토리 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: gradlew 실행 권한
        run: chmod +x ./gradlew

      - name: gradle 빌드
        run: ./gradlew build -x test

      - name: AWS 인증(ECR Push)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: ECR 로그인
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - name: Docker 이미지 빌드
        run: docker build -t todoc-backend .

      - name: Docker 이미지 태깅
        run: |
          docker tag todoc-backend:latest \
          ${{ steps.login-ecr.outputs.registry }}/todoc-backend:latest

      - name: ECR에 이미지 push
        run: |
          docker push \
          ${{ steps.login-ecr.outputs.registry }}/todoc-backend:latest